<text x="690" y="747" class="note">Kitchen target is achievable in plan, but the crossing clearance</text>
<text x="690" y="769" class="note">does not reach the 2.20 m benchmark with the assumed 120 mm</text>
<text x="690" y="791" class="note">stair thickness. Upper tread levels need not change; the support</text>
<text x="690" y="813" class="note">build-up would need structural redesign, not cosmetic trimming.</text>
<line x1="40" x2="1260" y1="855" y2="855" stroke="#ced5c5"/><text x="40" y="885" class="small">* Headroom checked against modeled tread undersides and slab. The 2.20 m benchmark comes from Kerala's published 2019 stair provisions;</text><text x="40" y="907" class="small">the architect must confirm applicable occupancy provisions and amendments. These are not structural or permit approvals.</text><text x="40" y="945" class="small">Neither option silently changes the requested south–north–east sequence: both require your choice to retain the existing final east-going flight.</text><text x="40" y="970" class="small">A full 2.90 m kitchen width at the increased depth needs its rear wall and door moved; retaining the existing door gives a stepped kitchen.</text></svg>